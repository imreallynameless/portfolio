# Deploy config for the TFT worker (separate file because wrangler.toml is
# one-worker-per-config and that one belongs to strava-worker).
#
#   npx wrangler deploy -c wrangler.tft.toml
#
# RIOT_API_KEY is a secret and is deliberately NOT declared here. Set it once
# with `npx wrangler secret put RIOT_API_KEY -c wrangler.tft.toml`; secrets are
# stored separately from the script and survive subsequent deploys.
name = "riot-tft"
main = "tft-worker-optimized.js"
# Matches the date already live on the riot-tft worker. The worker predates this
# config (it was only ever updated by pasting into the Cloudflare dashboard), so
# a lower date here would silently roll the runtime back on the first deploy --
# notably turning off handle_cross_request_promise_resolution (on since
# 2024-10-14), a promise-scheduling fix worth keeping now that the match-detail
# batching awaits a setTimeout promise.
compatibility_date = "2025-02-03"
